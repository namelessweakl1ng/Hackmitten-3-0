server {
    listen 443 ssl http2;
    server_name hackmitten.example.org;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate     /etc/letsencrypt/live/hackmitten.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackmitten.example.org/privkey.pem;

    client_max_body_size 9m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/auth/callback/credentials {
        limit_req zone=hackmitten_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/registrations {
        limit_req zone=hackmitten_registration burst=5 nodelay;
        client_max_body_size 2.1m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name hackmitten.example.org;
    return 301 https://$host$request_uri;
}
