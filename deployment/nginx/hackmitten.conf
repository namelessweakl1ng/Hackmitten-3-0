# This file is included from nginx http {} (for example sites-enabled).
limit_req_zone $binary_remote_addr zone=hackmitten_login_v3:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hackmitten_recovery_v3:10m rate=3r/m;

# ----------------------------------------------------------------------
# Frontend Server Block
# ----------------------------------------------------------------------
server {
  listen 80;
  server_name hackmitten-3-0.mitt.edu.in;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
}

# ----------------------------------------------------------------------
# Backend API Server Block
# ----------------------------------------------------------------------
server {
  listen 80;
  server_name hackmitten-3-0-api.mitt.edu.in;

  location = /api/auth/callback/credentials {
    limit_req zone=hackmitten_login_v3 burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location = /api/admin/credentials {
    limit_req zone=hackmitten_recovery_v3 burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
}

