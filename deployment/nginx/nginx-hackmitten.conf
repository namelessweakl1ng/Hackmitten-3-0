# Install deploy/nginx-limits.conf inside the nginx http {} block and make
# deploy/nginx-proxy-headers.conf available at the include path below.
upstream hackmitten_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream hackmitten_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name frontend.example.invalid;
    ssl_certificate     /etc/letsencrypt/live/frontend.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontend.example.invalid/privkey.pem;

    client_max_body_size 9m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Registration multipart payloads contain <=512,000-byte participant
    # images; this cap leaves room for JSON and multipart boundaries.
    location = /api/registrations {
        limit_req zone=hackmitten_registration burst=5 nodelay;
        client_max_body_size 2.1m;
        proxy_pass http://hackmitten_backend;
        include /etc/nginx/snippets/nginx-proxy-headers.conf;
    }

    location = /api/auth/callback/credentials {
        limit_req zone=hackmitten_auth burst=5 nodelay;
        proxy_pass http://hackmitten_backend;
        include /etc/nginx/snippets/nginx-proxy-headers.conf;
    }

    # Every API (including auth and private image routes) belongs to the
    # backend. Never map the storage root or private subdirectory with alias.
    location ^~ /api/ {
        proxy_pass http://hackmitten_backend;
        include /etc/nginx/snippets/nginx-proxy-headers.conf;
    }

    location / {
        proxy_pass http://hackmitten_frontend;
        include /etc/nginx/snippets/nginx-proxy-headers.conf;
    }
}

server {
    listen 80;
    server_name frontend.example.invalid;
    return 301 https://$host$request_uri;
}
